<!DOCTYPE html>
<html lang="ar" data-i18n-dir dir="rtl">
<head>
  <meta charset="utf-8" />
  <title data-i18n="ui_d9ca72ee2e">سين | الخرائط التشغيلية</title>
  <meta name="application-name" data-i18n-content="ui_d9ca72ee2e" content="سين | الخرائط التشغيلية">
  <meta name="apple-mobile-web-app-title" data-i18n-content="ui_d9ca72ee2e" content="سين | الخرائط التشغيلية">
  <link rel="icon" type="image/png" href="/img/seen-logo.png">
  <link rel="apple-touch-icon" href="/img/seen-logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    html, body {height: 100%;margin: 0;font-family: 'Tajawal', sans-serif;background: #0b0f14;overflow: hidden;}
    #map {position: fixed;inset: 0;width: 100%;height: 100%;z-index: 1;}
    #toolbar {position: fixed;top: 14px;right: 14px;z-index: 99999;display: flex;gap: 6px;padding: 10px;background: rgba(22,22,24,0.55);border: 1px solid rgba(255,255,255,0.1);border-radius: 14px;backdrop-filter: blur(12px);}
    .btn {height: 34px;padding: 0 12px;font-size: 13px;cursor: pointer;color: white;background: rgba(255,255,255,0.08);border: 1px solid rgba(255,255,255,0.12);border-radius: 10px;display: flex;align-items: center;gap: 6px;white-space: nowrap;}
    .btn[aria-pressed="true"] {background: rgba(66,133,244,0.8);border-color: rgba(66,133,244,1);}
    #mode-badge {position: fixed;bottom: 14px;right: 14px;padding: 8px 14px;background: rgba(255,255,255,0.1);border-radius: 14px;backdrop-filter: blur(12px);color: white;font-size: 13px;z-index: 99999;display: none;}
    #mode-badge.edit {background: rgba(66,133,244,0.7);} #mode-badge.view {background: rgba(224,62,62,0.7);}
    #toast {position: fixed;bottom: -80px;left: 50%;transform: translateX(-50%);padding: 12px 20px;background: rgba(20,20,20,0.9);border-radius: 12px;border: 1px solid rgba(255,255,255,0.1);backdrop-filter: blur(14px);color: white;font-size: 14px;z-index: 999999;min-width: 180px;text-align: center;transition: 0.35s;}
    #toast.show {bottom: 28px;}
    @media(max-width: 768px) {#toolbar {left: 14px;right: 14px;flex-wrap: wrap;justify-content: center;}.btn {flex: 1 1 auto;min-width: 74px;}}
    
    /* ===== تنسيق لوحة الطبقات الجديدة ===== */
    .layers-panel {
        position: fixed;
        top: 14px;
        left: 14px;
        width: 280px;
        background: rgba(22, 22, 24, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        color: white;
        font-family: 'Tajawal', sans-serif;
        z-index: 99999;
        display: none; /* مخفية افتراضيًا */
        flex-direction: column;
    }

    .layers-panel.show {
        display: flex;
    }

    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .panel-header h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
    }

    .btn-close {
        background: none;
        border: none;
        color: white;
        font-size: 22px;
        cursor: pointer;
        padding: 0;
        line-height: 1;
    }

    .panel-content {
        padding: 16px;
    }

    .layer-group {
        margin-bottom: 20px;
    }

    .layer-group:last-child {
        margin-bottom: 0;
    }

    .layer-group h4 {
        margin: 0 0 12px 0;
        font-size: 14px;
        color: #ccc;
        font-weight: 500;
    }

    .layer-group label {
        display: block;
        margin-bottom: 10px;
        font-size: 14px;
        cursor: pointer;
        padding: 5px;
        border-radius: 6px;
        transition: background-color 0.2s;
    }

    .layer-group label:hover {
        background-color: rgba(255, 255, 255, 0.1);
    }

    .layer-group input {
        margin-left: 10px;
    }
    
    .btn i {
        margin-left: 6px; 
        font-size: 18px; 
        vertical-align: middle; 
    }
    
    /* ============================================================
    تنسيق مفتاح التبديل (Switch) لشكل العلامة
    ============================================================ */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 28px;
      direction: ltr; 
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
    }

    input:checked + .slider {
      background-color: #4285f4; 
    }

    input:focus + .slider {
      box-shadow: 0 0 1px #4285f4;
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    .slider.round {
      border-radius: 28px;
    }

    .slider.round:before {
      border-radius: 50%;
    }
  </style>
  <link rel="stylesheet" href="/css/i18n.css">
</head>
<body>
  <div id="map"></div>

  <div id="layers-panel" class="layers-panel">
    <div class="panel-header">
      <h3><span data-i18n="ui_4e84b1f2ca">طبقات الخريطة</span></h3>
      <button id="btn-close-layers" class="btn-close">&times;</button>
    </div>
    <div class="panel-content">
      <div class="layer-group">
        <h4><span data-i18n="ui_d107cfc812">نوع الخريطة</span></h4>
        <label><input type="radio" name="base-map" value="roadmap" checked> <span data-i18n="ui_11a51d9661">طرق</span></label>
        <label><input type="radio" name="base-map" value="satellite"> <span data-i18n="ui_f688b63e9c">قمر صناعي</span></label>
        <label><input type="radio" name="base-map" value="terrain"> <span data-i18n="ui_ab8096cec8">تضاريس</span></label>
        <label><input type="radio" name="base-map" value="dark"> <span data-i18n="ui_178a969516">الوضع الليلي</span></label>
        <label><input type="radio" name="base-map" value="silver"> <span data-i18n="ui_1485ba4f8c">فضي</span></label>
      </div>
      <div class="layer-group">
        <h4><span data-i18n="ui_cb9fc0e7e9">طبقات إضافية</span></h4>
        <label><input type="checkbox" id="layer-traffic"> <span data-i18n="ui_1d3c6b66cf">حركة المرور</span></label>
        <label><input type="checkbox" id="layer-bicycling"> <span data-i18n="ui_eb991f46e1">مسارات الدراجات</span></label>
        <label><input type="checkbox" id="layer-transit"> <span data-i18n="ui_cc423c6817">خطوط النقل العام</span></label>
      </div>
    </div>
  </div>

  <div id="toolbar">
    <button id="btn-layers" class="btn" aria-pressed="false" data-i18n-title="ui_b218b90cbf" title="إظهار وإخفاء طبقات الخريطة">
      <i class="material-icons">layers</i>
      <span data-i18n="ui_c807bb507b">طبقات</span>
    </button>
    <button id="btn-add" class="btn" aria-pressed="false" data-i18n-title="ui_58127280ec" title="إضافة موقع جديد على الخريطة">
      <i class="material-icons">add_location</i>
      <span data-i18n="ui_8c43ff32e8">إضافة موقع</span>
    </button>
    <button id="btn-free-draw" class="btn" aria-pressed="false" data-i18n-title="ui_d1e6c94db2" title="رسم حر (أيقونات ونصوص)">
      <i class="material-icons">brush</i>
      <span data-i18n="ui_c17be9dfd0">رسم حر</span>
    </button>
    <button id="btn-polygon" class="btn" aria-pressed="false" data-i18n-title="ui_e6220846fb" title="رسم مضلع على الخريطة">
      <i class="material-icons">polyline</i>
      <span data-i18n="ui_5d7bef9683">مضلع</span>
    </button>
    <button id="btn-route" class="btn" aria-pressed="false" data-i18n-title="ui_79fa07f78b" title="رسم مسار على الخريطة">
      <i class="material-icons">route</i>
      <span data-i18n="ui_b21623d92f">مسار</span>
    </button>
    <button id="btn-measure" class="btn" aria-pressed="false" data-i18n-title="ui_2d0cc66b2e" title="قياس مسافة أو مساحة">
      <i class="material-icons">straighten</i>
      <span data-i18n="ui_c4622d4107">قياس</span>
    </button>
    <button id="btn-draw-finish" class="btn" style="display: none;" data-i18n-title="ui_ba78d56afc" title="إنهاء الرسم الحالي">
      <i class="material-icons">check</i>
      <span data-i18n="ui_243165ff41">إنهاء الرسم</span>
    </button>
    <button id="btn-route-clear" class="btn" aria-pressed="false" data-i18n-title="ui_87c1a0abfd" title="مسح المسار النشط">
      <i class="material-icons">delete_sweep</i>
      <span data-i18n="ui_0286666894">مسح المسار</span>
    </button>
    <button id="btn-edit" class="btn" aria-pressed="true" data-i18n-title="ui_7b4128ce57" title="تبديل وضع التحرير">
      <i class="material-icons">edit</i>
      <span data-i18n="ui_3e3d8fa76f">تحرير</span>
    </button>
    <button id="btn-share" class="btn" data-i18n-title="ui_4e781e9189" title="مشاركة رابط الخريطة الحالية">
      <i class="material-icons">share</i>
      <span class="label"><span data-i18n="ui_0196884ea4">مشاركة</span></span>
    </button>
  </div>
  
  <div id="mode-badge"></div>
  <div id="toast"></div>
  
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script src="/js/i18n/ar.js"></script>
  <script src="/js/i18n/en.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/android.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/mobile.js"></script>

  <script async data-map-src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAbyDb68H77pxFnzH0IW3O35_HxDcMQ3TQ&libraries=geometry,marker,places,drawing&callback=initMap"></script>
</body>
</html>
